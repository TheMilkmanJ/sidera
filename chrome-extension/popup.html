<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sidera Mediator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 340px; margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; font-size: 13px; }
    h2 { margin: 0 0 10px 0; font-size: 16px; display: flex; align-items: center; justify-content: space-between; color: #38bdf8; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; background: #334155; color: #cbd5e1; }
    .badge.active { background: #059669; color: #ecfdf5; }
    .badge.paused { background: #d97706; color: #fffbeb; }
    .badge.error { background: #dc2626; color: #fef2f2; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .metric-row { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .metric-label { color: #94a3b8; white-space: nowrap; }
    .metric-val { font-weight: 600; color: #e2e8f0; text-align: right; overflow-wrap: anywhere; }
    .error-text { color: #fca5a5; font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; display: none; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin: 10px 0 6px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    button { padding: 7px 10px; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .btn-pair { background: #334155; color: #f8fafc; }
    .btn-pair:hover { background: #475569; }
    .btn-pair.paired { background: #0284c7; }
    .btn-start { background: #16a34a; color: white; }
    .btn-start:hover { background: #15803d; }
    .btn-pause { background: #ea580c; color: white; }
    .btn-pause:hover { background: #c2410c; }
    .btn-stop { background: #b91c1c; color: white; grid-column: span 2; }
    .btn-stop:hover { background: #991b1b; }
    .btn-quiet { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-quiet:hover { background: #334155; }
    .setting-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .setting-row label { color: #94a3b8; flex: 1; }
    .setting-row input { width: 64px; padding: 5px 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 12px; }
    .status-text { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>Sidera Mediator <span id="stateBadge" class="badge">IDLE</span></h2>
  <div class="card">
    <div class="metric-row"><span class="metric-label">Turn:</span><span id="turnCount" class="metric-val">0</span></div>
    <div class="metric-row"><span class="metric-label">Last Message ID:</span><span id="lastMsgId" class="metric-val">-</span></div>
    <div class="metric-row"><span class="metric-label">Mediator:</span><span id="ipcStatus" class="metric-val">Checking...</span></div>
    <div class="metric-row"><span class="metric-label">Mode:</span><span id="modeStatus" class="metric-val">-</span></div>
    <div id="lastError" class="error-text"></div>
  </div>

  <div class="section-title">Pair tabs (open the tab first, then click)</div>
  <div class="btn-group">
    <button id="btnPairLeft" class="btn-pair">Pair LEFT (ChatGPT)</button>
    <button id="btnPairRight" class="btn-pair">Pair RIGHT (Grok)</button>
  </div>

  <div class="section-title">Exchange</div>
  <div class="btn-group">
    <button id="btnStart" class="btn-start">Start Exchange</button>
    <button id="btnPause" class="btn-pause">Pause</button>
  </div>
  <div class="btn-group">
    <button id="btnStop" class="btn-stop">Emergency STOP</button>
  </div>

  <div class="section-title">Manual forward (one completed reply)</div>
  <div class="btn-group">
    <button id="btnForwardLR" class="btn-quiet">LEFT &rarr; RIGHT</button>
    <button id="btnForwardRL" class="btn-quiet">RIGHT &rarr; LEFT</button>
  </div>

  <div class="section-title">Settings and files</div>
  <div class="setting-row">
    <label for="maxTurns">Maximum autonomous turns</label>
    <input id="maxTurns" type="number" min="1" step="1" value="50">
    <button id="btnApplyMax" class="btn-quiet">Apply</button>
  </div>
  <div class="btn-group">
    <button id="btnOpenData" class="btn-quiet">Open data folder</button>
    <button id="btnOpenLog" class="btn-quiet">Open latest log</button>
  </div>

  <div class="status-text" id="statusMessage">Pair both tabs to begin.</div>
  <script src="popup.js"></script>
</body>
</html>
