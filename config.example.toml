# Sidera Dual-Hemisphere Mediator configuration.
# Copy this file to config.toml next to it (C:\Sidera\config.toml on Windows).
# Every key is optional; anything missing uses the default shown here.
# Relative paths are resolved from the folder that holds config.toml.

[mediator]
# Where the ledger, transcripts, logs, memory and the file sandbox live.
# Windows install: C:\Sidera\data
data_root = "data"

# Second line of defence against a runaway conversation. The mediator pauses
# when this many autonomous turns have been sent. Can also be changed from the
# extension popup while running.
max_autonomous_turns = 50

# false = monitoring and logging only. Replies are still captured, tags are
# still executed and everything is logged, but nothing is ever pasted into a
# chat. Use this to observe the browsers safely or to test a new adapter.
autonomous_submissions = true

[genesis]
# Teach both AIs the Sidera tag protocol when Start is pressed (and again in
# any fresh chat a side has to open). Set to false to skip the handshake and
# start straight in WAIT_LEFT.
enabled = true
prompt_file = "mediator/genesis_protocol.md"

[logging]
# DEBUG, INFO, WARNING or ERROR
level = "INFO"
